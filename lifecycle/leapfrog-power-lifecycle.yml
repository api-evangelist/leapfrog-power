summary: >-
  Leap versions in the URI path, at a per-service rather than platform-wide cadence: /v1.1 for
  create-meters, webhooks, revenue and interval data, /v2 for meters, enrollments, nominations and
  dispatch. Deprecation is announced on the developer-portal changelog with a named calendar date
  and a documented migration path; there is no Sunset or Deprecation response header, no published
  SLA and no formal deprecation-policy page — the changelog post IS the policy artifact.
versioning:
  scheme: uri-path
  per_service: true
  current:
  - service: Create Meters
    version: v1.1
    spec_version: 1.1.0
    openapi: 3.0.2
