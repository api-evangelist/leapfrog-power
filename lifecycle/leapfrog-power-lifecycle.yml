  docs: https://developer.leap.energy/changelog
  observations:
  - Four OpenAPI patch versions (3.0.1, 3.0.2, 3.0.3, 3.1.0) across eight documents.
  - Path moves are announced as version bumps, e.g. the webhook platform moved from /beta to /v1.1
    at GA and the Revenue API moved from /beta to /v1 at GA.
  - 'Field additions are stated by Leap to be non-breaking: "Field additions like this are
    considered non-breaking changes for existing integrations" (nomination_kw changelog post).'
