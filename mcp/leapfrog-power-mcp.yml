safety_notes:
- Read tools (get_*, list_*, search_*) return partner-scoped consented meter, enrollment, dispatch
  and settlement data and are the safe default surface.
- 'Write tools carry real grid and revenue consequences and should require explicit confirmation:
  create_meter_batch_job / create_single_meter add billable inventory; post_*_nomination_suggestions
  offers capacity into a wholesale market; create_or_update_meter_dispatch_webhook and
  create_or_update_group_dispatch_webhook redirect live grid dispatch traffic away from the
  partner''s existing receiver.'
