generated: '2026-07-27'
method: derived
source: openapi/*, https://developer.leap.energy/docs/api-key-authentication, https://developer.leap.energy/docs/webhook-setup,
  live /.well-known/ probes, https://www.leap.energy/
summary: >-
  Leap asserts no formal standards conformance and publishes no certifications or compliance
  program. The findings below are derived from the eight published OpenAPI definitions, the
  developer documentation and live probes. Leap's domain standards are electricity-market rather
  than IT — it operates inside ISO/RTO wholesale market and utility demand-response program rules
  (CAISO, NYISO, PJM, ERCOT), which are program requirements rather than API specifications. No
  Green Button, ESPI, OpenADR, IEEE 2030.5, OCPP, OCPI or CIM reference appears anywhere in Leap's
  public surface.
standards:
- id: openapi-3
  conforms: true
  evidence: Eight published definitions spanning OpenAPI 3.0.1, 3.0.2, 3.0.3 and 3.1.0, all served
    anonymously from api.leap.energy and all parsing cleanly.
- id: oauth2
  conforms: false
  evidence: No oauth2 securityScheme in any definition; authorization is a Partner-Portal-issued
    bearer API key with per-key permissions.
- id: oidc
  conforms: false
  evidence: No openIdConnect securityScheme and no /.well-known/openid-configuration (404 on
    api.leap.energy, api.staging.leap.energy, developer.leap.energy and www.leap.energy).
- id: rfc8414-oauth-metadata
  conforms: false
  evidence: /.well-known/oauth-authorization-server returns 404 on all four hosts.
- id: rfc6750-bearer-token
  conforms: partial
  evidence: >-
    Uses the RFC 6750 `Authorization: Bearer` header form, but the credential is a long-lived API
    key rather than an OAuth 2.0 access token, and no WWW-Authenticate challenge is documented. Four
    of the eight definitions declare bearerFormat JWT and the Getting Started guide shows a JWT
    payload with a permissions array and expiration_date.
- id: rfc9457-problem-details
  conforms: false
  evidence: >-
    No application/problem+json media type anywhere. The dominant envelope reuses the RFC 7807 field
    names `title` and `status` plus a `details` member over application/json, without a `type` URI.
    Two further envelopes are in use — see errors/leapfrog-power-problem-types.yml.
- id: rfc9116-security-txt
  conforms: false
  evidence: /.well-known/security.txt returns 404 on all four Leap hosts.
- id: rfc8594-sunset-header
  conforms: false
  evidence: >-
    No Sunset or Deprecation response header is declared or documented. Deprecation is announced on
    the developer-portal changelog with a named calendar date (Meters API v1, 2026-10-31).
- id: cursor-pagination
  conforms: true
  evidence: page_token / page_size request fields with next_page_token in responses, applied
    consistently across meters, enrollments, nominations, dispatch, revenue, create-meters and
    interval-data endpoints.
- id: idempotency-keys
  conforms: false
  evidence: >-
    No Idempotency-Key header and no idempotency documentation. Unsafe retries are mitigated only by
    the async job model, PUT-overwrite webhook endpoints and partner_reference reconciliation.
- id: asyncapi
  conforms: false
  evidence: >-
    Leap publishes a webhook event catalog with example payloads and dispatch webhook registration
    endpoints, but no AsyncAPI document. asyncapi/leapfrog-power-events-asyncapi.yml in this repo is
    an API Evangelist derived rendering of the published catalog.
- id: webhook-signing
  conforms: false
  evidence: >-
    No HMAC signature, signing secret or timestamp-replay defence is published; Leap's documented
    pattern is a partner-supplied static header (e.g. x-api-key) in the webhook headers array.
- id: json-api
  conforms: false
- id: odata
  conforms: false
- id: scim2
  conforms: false
- id: fhir-r4
  conforms: false
- id: fapi
  conforms: false
- id: psd2
  conforms: false
- id: green-button-espi
  conforms: false
  evidence: >-
    No Green Button, ESPI or Energy Services Provider Interface reference in the docs, llms.txt
    index or specs. Leap integrates California IOU customer authorization through the utilities'
    ShareMyData service, which it names only by that trade name.
- id: openadr
  conforms: unknown
  evidence: >-
    OpenADR 2.0b/3.0 is the standard demand-response signalling protocol in this domain and Leap
    terminates utility/ISO program signals on the market side, but Leap does not document OpenADR
    conformance on its partner-facing API — dispatch reaches partners as Leap-proprietary JSON
    webhooks or polled dispatch search results.
- id: ieee-2030.5
  conforms: false
  evidence: No reference anywhere in Leap's public surface.
market_programs:
  note: Regional market participation is a commercial/regulatory posture, not an API standard, and is
    recorded here for context only.
  regions_documented: [CAISO, NYISO, PJM, ERCOT, WECC_PC, WECC_SW]
  programs_named_in_public_docs: [CCA, ELRP, DSGS, CSRP, DLRP, DRAM, PSE-RPO, SRP-RPO]
certifications:
  published: false
  evidence: >-
    No trust center and no SOC 2 / ISO 27001 / PCI DSS / HIPAA / FedRAMP claim found. trust.leap.energy
    does not resolve; www.leap.energy/security, /trust and /compliance return 404. No `Compliance`
    pointer is emitted in apis.yml as a result.
transport_security:
  note: See security/leapfrog-power-domain-security.yml — TLS 1.3 on the web and developer hosts,
    TLS 1.2 on api.leap.energy, HSTS with a one-year max-age on all three, DNSSEC enabled on
    leap.energy, SPF and DMARC present (policy quarantine), no CAA records.
