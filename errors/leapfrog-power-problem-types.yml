  - openapi/leapfrog-power-nominations-openapi.yml#deleteMeterNominationSuggestion
  - openapi/leapfrog-power-webhooks-openapi.yml#deleteWebhook
- status: 415
  title: Unsupported Media Type
  envelope: title-status-details
  meaning: Invalid value in the Accept header. Supported types are application/json and text/csv.
  source_operations:
