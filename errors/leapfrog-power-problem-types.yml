  - openapi/leapfrog-power-revenue-analytics-openapi.yml#getPeriodicReports
- status: 500
  title: Server Error
  envelope: title-status-details
  meaning: A technical error has occurred.
  source_operations:
  - openapi/leapfrog-power-revenue-analytics-openapi.yml#getPeriodicReports
  - openapi/leapfrog-power-interval-data-upload-openapi.json#uploadIntervalData
- status: 5XX
  title: Server error range
  envelope: code-message-error_code
  meaning: The Dispatch API declares a single 5XX range response rather than discrete 500/503 codes.
  source_operations:
  - openapi/leapfrog-power-dispatch-openapi.yml#searchMeterDispatches
  - openapi/leapfrog-power-dispatch-openapi.yml#createOrUpdateMeterDispatchWebhook
gaps:
- No `type` URI, no application/problem+json, no error documentation page on the developer portal
  outside the OpenAPI definitions.
- Three envelopes across eight services; a partner integrating more than one Leap product must
  parse all three.
- No documented Retry-After, RateLimit-* or request-correlation header in any definition.
