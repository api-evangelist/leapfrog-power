apiFamilySegmentation:
  note: >-
    Leap's docs segment the API by the meter lifecycle, not by data domain. Recorded
    faithfully as the docs present it.
  segments:
    - name: Onboard
      surface: Leap Connect / Direct to Utility URLs, Connect API, Create Meters API
    - name: Manage meters
      surface: Meter Details API, Meter Enrollment API (idle periods, disenrollment, participation, tags)
    - name: Bid / nominate
      surface: Meter Nomination API (suggestions reviewed and approved by Leap, not auto-accepted)
    - name: Dispatch
      surface: Dispatch API V2, webhook push notifications and dispatch event polling
    - name: Settle
      surface: Revenue & Analytics API, event performance and interval data, SFTP interval upload

findings:
  summary: |
    Leap is a clean example of the private, unmandated layer of the US energy stack, and
    a clean example of why "mandate" and "implementation" must be recorded separately.
    There is a real mandate in this story — California compels its investor-owned
    utilities to operate a customer-authorised third-party data-sharing portal — but the
    mandate binds PG&E, SCE and SDG&E, not Leap. Leap is the beneficiary. It plugs into
    that compelled portal, plus its own hosted Leap Connect flow for CA/NY/PJM, and
    turns the resulting consented meter data into market participation revenue.

    Leap's documentation posture is genuinely good and genuinely open: a public ReadMe
    portal, a public llms.txt, a changelog, a status page, staging and production hosts,
    and eight OpenAPI documents that download anonymously with no key. That is more
    machine-readable contract than most utilities in this sector publish. But nobody can
    self-serve into it — the API is a partner integration surface for a B2B contract,
    and the only public front door is "Book a demo".

    The split is stark and it is the finding: consumer/asset data is reachable through
    documented APIs but only for a contracted partner's own consented meters, while open
    market data is entirely absent even though Leap operates in three of the seven
    US ISOs/RTOs. Leap consumes market access; it does not redistribute it.
  standardsPosture: >-
    Zero sector-standard adoption. No Green Button, ESPI, OpenADR, IEEE 2030.5, OCPP,
    OCPI or CIM reference anywhere in Leap's public surface. The universal-API pitch —
    "integrate once, scale to all markets & programs" — is explicitly Leap's proprietary
    shape substituting for the absence of a standard, which is the commercial logic of
    this whole layer of the US market.
  governanceObservations:
    - Four different OpenAPI patch versions (3.0.1, 3.0.2, 3.0.3, 3.1.0) across eight documents.
    - Two different securityScheme names for the same bearer scheme (Bearer and http).
    - Interval Data Upload declares a securityScheme but no top-level security requirement.
    - Only the Dispatch spec carries info.contact; the other seven have none.
    - Service-specific spec paths (/v1.1/openapi-docs/, /v2/openapi-docs/, /settlement-service/openapi, /webhook-service/schema/) indicate per-team publication with no central spec index.

duplicateWarning:
  isDuplicate: true
  survivorCandidate: undetermined — flag for the duplicate-provider-retirement process
  otherRepo: /Users/kinlane/GitHub/all/leap
  detail: >-
    An existing api-evangelist repo all/leap profiles THIS SAME COMPANY under aid "leap"
    at domain leap.energy, already enriched (10 apis[] entries, 7 harvested _original
    OpenAPIs, authentication/changelog/conformance/data-model/mcp/skills/llms artifacts
    and four kin score files). leap.ac and leap.energy are the same legal entity,
    Leapfrog Power, Inc. This repo (leapfrog-power) was created from the energy sector
    sweep against the leap.ac domain. These two should be merged rather than both
    published. Note that this bootstrap harvested EIGHT specs — all/leap is missing the
    Interval Data Upload spec (partner-interval-data-service) — so this repo's openapi/
    is the more complete harvest even though all/leap is the more enriched repo.
