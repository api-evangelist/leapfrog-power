summary: >-
  No /.well-known/ discovery document is published on any Leap host. Twenty probes — five
  well-known paths against the four hosts that appear in apis.yml and the OpenAPI servers[]
  arrays — all returned 404. Recorded as an honest negative result. Leap issues partner API
  keys from the Partner Portal rather than through OAuth or OpenID Connect, so there is no
  authorization-server metadata to publish, and it ships no security.txt, no api-catalog and
  no ai-plugin manifest.
