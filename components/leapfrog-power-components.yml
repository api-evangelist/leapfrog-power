generated: '2026-07-27'
method: searched
source: https://developer.leap.energy/docs/leap-connect, https://developer.leap.energy/docs/collect-data-authorization,
  https://developer.leap.energy/docs/customer-reengagement, https://developer.leap.energy/docs/test-utilities
summary: >-
  Leap ships no JavaScript element library, web components or embeddable widget SDK. Its single
  client-side surface is Leap Connect — a hosted, partner-branded web flow the partner links or
  redirects customers into rather than embeds. Everything else is server-side REST plus the
  first-party Leap Partner Portal.
components:
- family: Leap Connect
  name: Leap Connect hosted authorization flow
  kind: hosted-redirect-flow
  docs: https://developer.leap.energy/docs/leap-connect
  description: >-
    Partner-branded, multi-market hosted flow that walks an end customer through connecting their
    utility account, supplying required program information, and e-signing any agreements the
    market or customer type requires. Where applicable Leap redirects the customer to their
    utility's login screen to authorize data sharing, then back into Connect, and finally to a
    partner-supplied Final Redirect URL.
  url_shape: https://connect.leap.energy?transmissionRegion=<region>&variant=<customer-classification>&account=<org-name>&refId=<reference-id>
  legacy_url_shape: https://onboarding.leap.energy/<org-name>/<flow-name>?refId=<reference-id>
  legacy_note: >-
    Existing onboarding.leap.energy flows continue to work unchanged after the October 2025
    architectural update; the connect.leap.energy shape applies to newly created flows and can be
    generated by the partner without Leap involvement.
  parameters:
  - name: transmissionRegion
    required: true
    values: [CAISO, NYISO, PJM, ERCOT, WECC_PC, WECC_SW]
  - name: account
    required: true
    description: The partner account name, shown top-left on the Partner Account page.
  - name: variant
    required: false
    values: [RESIDENTIAL, COMMERCIAL, RESIDENTIAL_AGREEMENTS_ONLY, COMMERCIAL_AGREEMENTS_ONLY]
    description: Defaults to RESIDENTIAL when neither variant nor program is supplied. The
      AGREEMENTS_ONLY options are currently PJM-only.
  - name: program
    required: false
    values: [PSE-RPO, SRP-RPO]
    description: Required for Puget Sound Energy and Salt River Project utility territories.
  - name: refId
    required: false
    description: The partner's own identifier for the customer or site, carried through the flow so
      Connect sessions and resulting meters reconcile with partner systems.
  configuration: >-
    Branding, e-sign forms and participating utilities are configured per partner; the URL itself
    can be generated from the Partner Portal Connections tab via the "+ Connect link" button or
    constructed programmatically.
  embedding: >-
    Not an embeddable component — the documented pattern is to link to the URL from a point-of-sale
    flow, a mobile app install step, or a re-engagement marketing campaign.
  regions_documented:
  - California (CAISO)
  - New York (NYISO)
  - PJM
  - Texas (ERCOT)
  - WECC_PC / WECC_SW
  - PSE / SRP / TVA utility programs (letter-of-authorization only, commercial customers)
  events: >-
    Flow progress is reported back over the connect_session.updated and
    connect_session.authorization_updated webhook events (see
    asyncapi/leapfrog-power-events-asyncapi.yml) and read through the getConnections endpoint.
  testing: Staging demo utilities for CAISO and NYISO exercise the full flow — see
    sandbox/leapfrog-power-sandbox.yml.
loader_libraries: []
element_libraries: []
embedded_dashboards:
  published: false
  note: >-
    The Leap Partner Portal (partner.leap.energy) is a first-party application for partner staff,
    not an embeddable or white-labelled dashboard product.
