name: Leap
kind: company
description: Leap (Leapfrog Power, Inc.) is a San Francisco based energy software company whose
  primary domain leap.ac 301-redirects to www.leap.energy. Leap sits in the private, unmandated
  layer of the United States energy stack — between distributed energy resources and the wholesale
  markets — letting technology brands build and scale virtual power plants without owning market
  access. Its software-only platform aggregates residential and commercial battery storage, smart
  thermostats, heat pumps, HVAC and EV charging, registers those assets into CAISO, NYISO, PJM and
  utility demand response programs, and settles the revenue back to the partner. Leap publishes a
  genuinely open developer portal at developer.leap.energy with eight anonymously downloadable
  OpenAPI definitions covering meter creation, enrollment and idle periods, meter details, market
  nominations, dispatch, webhooks, interval data upload and revenue and analytics. Its API posture
  is open documentation over a closed door — every specification and guide can be read without an
  account, but no key can be self-issued — keys are created only inside a Leap-provisioned partner
  account and prospective partners are told to contact an account manager or partners@leap.ac. No
  data-sharing mandate applies to Leap. It is not a utility, not a retailer and not a designated data
  holder anywhere; it is a downstream recipient of consumer data that California's investor-owned
  utilities are compelled to share, integrating PG&E, SCE and SDG&E through their Share My Data
  authorization flow. Leap's documentation never names Green Button, ESPI, OpenADR, IEEE 2030.5,
  OCPP or CIM. Consumer usage and settlement data are reachable through the API but only for a
  partner's own consented, enrolled meters, and Leap publishes no open grid or market data at all.
