generated: '2026-07-27'
method: searched
source: https://developer.leap.energy/docs/getting-started, https://developer.leap.energy/docs/api-key-authentication,
  https://developer.leap.energy/docs/webhook-setup, https://developer.leap.energy/docs/retry-mechanism,
  https://developer.leap.energy/docs/webhook-push-notifications-v2, openapi/*
summary: >-
  Leap's cross-cutting semantics are consistent where it matters most for a partner integration —
  one bearer scheme, one cursor-pagination shape, one POST-search idiom, UTC-only datetimes — and
  inconsistent in the places a governance review notices: three error envelopes, four OpenAPI
  patch versions, two names for the same security scheme, and no idempotency, request-correlation
  or rate-limit contract anywhere.
authentication:
  style: bearer-api-key
  header: 'Authorization: Bearer <API_KEY>'
  issuer: Partner Portal (https://partner.leap.energy/account?settings=apiKeys)
  environment_scoped: true
  wrong_environment_result: 403
  per_key_permissions: true
  detail: See authentication/leapfrog-power-authentication.yml.
idempotency:
  supported: false
  header: null
  evidence: >-
    No Idempotency-Key parameter appears in any of the eight OpenAPI definitions and no idempotency
    guidance appears anywhere in the developer documentation or llms.txt index. A retried write is
    a second write.
  partial_mitigations:
  - Meter creation is asynchronous and job-based (POST /v1.1/jobs/meters returns a job_id that can
    be polled with getMeterBatchJob), so a partner can check job state before retrying.
  - partner_reference is a partner-supplied identifier carried on meters and dispatch notifications
    and is the practical reconciliation key for detecting duplicates after the fact.
  - Webhook receivers must be duplicate-tolerant by design — Leap's own documentation warns that a
    dropped acknowledgement causes a retry the partner will see as a duplicate; de-duplicate on
    webhook_event_id (platform events) or meter_event_id / market_group_event_id (dispatch).
  - 'PUT semantics on the dispatch webhook endpoints are naturally idempotent: createOrUpdateMeterDispatchWebhook
    and createOrUpdateGroupDispatchWebhook overwrite rather than append.'
pagination:
  style: opaque-cursor
  request_fields:
  - name: page_token
    location: request body (search endpoints) — "If there are more meters to fetch, this token will
      be populated as next_page_token in the response. Use it to fetch the next page."
  - name: page_size
    location: request body; examples show 100 and 500
  response_fields:
  - name: next_page_token
    note: Populated only when more results exist; absent/empty means the last page.
  applies_to:
  - openapi/leapfrog-power-meter-details-openapi.yml
  - openapi/leapfrog-power-meter-enrollment-openapi.yml
  - openapi/leapfrog-power-nominations-openapi.yml
  - openapi/leapfrog-power-create-meters-openapi.yml
  - openapi/leapfrog-power-dispatch-openapi.yml
  - openapi/leapfrog-power-revenue-analytics-openapi.yml
  - openapi/leapfrog-power-interval-data-upload-openapi.json
  exceptions:
  - The Webhook Subscription API (listWebhooks) is unpaginated.
  volume_limits:
  - The interval and performance list endpoints cap a request at 1,000,000 data points and return
    400 above it; reduce the day range or the meter count.
  - Nomination suggestion arrays are capped at 10,000 items per request.
query_idiom:
  style: POST-search
  detail: >-
    Filtering is done by POSTing a filter body to a /search sub-resource (searchMeterDetails,
    searchMeterEnrollments, searchNominations, searchNominationSuggestions, searchMeterDispatches,
    searchGroupDispatches, searchMissingIntervalData, and the five revenue aggregation searches)
    rather than by GET query strings. GET is reserved for single-resource reads by path id and for
    a handful of list endpoints.
content_negotiation:
  request: application/json; multipart/CSV upload on the meter-creation and interval-data endpoints
  response: application/json by default; text/csv available on nomination search, nomination
    suggestion search, revenue search and meter creation via the Accept header
  wrong_accept_result: 415 with "Invalid value in the 'Accept' header. Supported types are
    application/json and text/csv"
field_conventions:
  case: snake_case throughout
  identifiers: UUIDs for meter_id, job_id, webhook_id, market_group_id, meter_event_id,
    market_group_event_id, nomination_suggestion_id, webhook_event_id — no typed id prefixes
  partner_key: >-
    partner_reference is the partner's own identifier for a meter or site, carried through Leap
    Connect (as refId), meter records, webhook events and dispatch notifications; it is the
    documented correlation key between Leap and partner systems.
  datetimes: ISO 8601 in UTC. The bidding guide states verbatim that all datetimes must be provided
    in the UTC timezone; idle-period dates are the exception and respect the meter's local timezone.
  units: kW for capacity and dispatch (energy_kw, nomination_kw), kWh for metered energy
    (energy_generated_kwh, energy_consumed_kwh, energy_net_kwh); intervals are 15 minutes
  nulls: energy_kw null on a dispatch timeslot means "dispatch the maximum you can manage"
metadata:
  supported: partial
  detail: Free-form metadata is not supported, but meters carry partner-assigned tags (postV11MetersTags
    / deleteV11MetersTags in the reference) and a partner_meter_ref / partner_reference field.
request_tracing:
  request_id_header: null
  evidence: No X-Request-Id, correlation-id or trace header is declared in any definition or
    documented on the portal.
versioning:
  scheme: uri-path, per service (/v1.1 and /v2)
  detail: See lifecycle/leapfrog-power-lifecycle.yml.
error_envelope:
  primary: '{title, status, details}'
  variants: 3 (see errors/leapfrog-power-problem-types.yml)
  rfc9457: false
rate_limiting:
  documented: false
  headers: none declared
  evidence: >-
    No RateLimit-*, X-RateLimit-* or Retry-After header appears in any definition, and no 429
    response is declared anywhere in the eight specs. Volume is instead bounded by explicit payload
    caps (1,000,000 data points, 10,000 nomination items).
webhook_delivery:
  receiver_requirements: HTTPS on TCP port 443, 8443 or 8843, TLS 1.2 or 1.3, JSON body, 2xx within
    10 seconds
  platform_retries: up to 10 attempts over 8 hours (immediate, 1m, 2m, 4m, 8m, 16m, 29m, 1h, 2h, 4h)
  dispatch_retries: every 1 minute for up to 50 minutes (50 attempts)
  signing: >-
    No HMAC signature or signing secret is published. Leap's documented pattern is for the partner
    to supply their own static auth header in the webhook `headers` array (e.g. x-api-key) and
    validate it on receipt; header names are delivered lower-cased regardless of how they were set.
  duplicates: possible by design — de-duplicate on webhook_event_id / meter_event_id
  detail: See asyncapi/leapfrog-power-events-asyncapi.yml.
bulk_and_async:
  jobs: Meter creation and interval-data ingestion are asynchronous job surfaces — submit, receive a
    job_id, poll status and per-row errors.
  sftp: Interval data may alternatively be dropped on Leap's SFTP server
    (https://developer.leap.energy/docs/upload-interval-data-sftp).
  presigned_urls: intervalDataPresignedUrl returns a 302 redirect to a presigned file location.
