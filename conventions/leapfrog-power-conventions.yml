  authentication: authentication/leapfrog-power-authentication.yml
  errors: errors/leapfrog-power-problem-types.yml
  error_codes: errors/leapfrog-power-error-codes.yml
  lifecycle: lifecycle/leapfrog-power-lifecycle.yml
  sandbox: sandbox/leapfrog-power-sandbox.yml
  events: asyncapi/leapfrog-power-events-asyncapi.yml
